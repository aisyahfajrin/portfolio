<!DOCTYPE html>
<html lang="en">
<head>
  <title>Ops Weekly Dashboard · Demo</title>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --ink: #1F2A33; --text: #3D4750; --body: #545454; --muted: #6B7680;
  --line: #E3EAF0; --line-soft: #EEF2F5; --bg: #F5F8FB; --card: #FFFFFF;
  --brand: #34B6F8; --brand-dark: #0077B6; --brand-deep: #005A8C; --brand-tint: #EBF7FE;
  --red: #B42318; --red-tint: #FDF1F0; --amber: #8A5300; --amber-tint: #FFF4E0;
  --green: #1E6B45; --green-tint: #E6F6EE;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: var(--body); }
button, input, select, textarea { font-family: inherit; }
button { cursor: pointer; }
a { color: var(--brand-dark); } a:hover { color: var(--brand-deep); }
.muted { color: var(--muted); font-size: 13px; }

.app { display: flex; min-height: 100vh; }
.side { width: 248px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 28px; padding: 28px 18px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { display: flex; flex-direction: column; gap: 8px; padding: 0 8px; }
.logo { width: 150px; height: auto; display: block; }
.brand-sub { font-size: 12px; font-weight: 600; letter-spacing: .6px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-item { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; font-size: 14px; font-weight: 500; color: var(--text); text-align: left; }
.nav-item:hover { background: #F4F8FB; }
.nav-item.on { background: var(--brand-tint); color: var(--brand-deep); font-weight: 700; }
.nav-item .grow { flex-grow: 1; }
.badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #F1F4F7; color: var(--text); }
.nav-item.on .badge { background: #fff; }
.nav-group { display: flex; flex-direction: column; gap: 6px; padding: 0 8px; }
.nav-label { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: var(--muted); padding-bottom: 4px; }
.dept-item { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; margin: 0 -10px; border: none; border-radius: 10px; background: transparent; font-size: 14px; color: var(--text); text-align: left; }
.dept-item:hover { background: #F4F8FB; }
.dept-item.on { background: var(--brand-tint); color: var(--brand-deep); font-weight: 700; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; display: inline-block; }

.main { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 14px; padding: 22px 36px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
.top-title { flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 220px; }
h1 { margin: 0; font-size: 24px; font-weight: 800; color: var(--ink); letter-spacing: -.3px; }
.search { display: flex; align-items: center; gap: 8px; width: 280px; height: 44px; padding: 0 14px; border: 1px solid #D5DEE6; border-radius: 10px; background: #F8FAFC; }
.search input { border: none; background: transparent; outline: none; font-size: 14px; flex-grow: 1; color: var(--ink); }
.filler { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text); }
.filler select { height: 44px; padding: 0 10px; border: 1px solid #D5DEE6; border-radius: 10px; font-size: 14px; background: #fff; color: var(--ink); }
.filler select.need { border-color: var(--red); background: var(--red-tint); }
.btn { height: 44px; padding: 0 18px; border-radius: 10px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid #D5DEE6; background: #fff; color: var(--ink); }
.btn.primary { border: none; background: var(--brand-dark); color: #fff; }
.btn.primary:hover { background: var(--brand-deep); }
.btn.small { height: 40px; padding: 0 14px; font-size: 13px; }
.link-btn { background: none; border: none; color: var(--brand-dark); font-size: 13px; font-weight: 700; padding: 8px 0; }

.content { padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 20px; }
.loading, .empty { padding: 24px; border: 1.5px dashed #C7D3DD; border-radius: 12px; text-align: center; font-size: 13px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 6px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 8px; }
.card h2 { margin: 0; font-size: 17px; font-weight: 700; color: var(--ink); }
.source { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: start; }
.span-2 { grid-column: span 2; }
.stack { display: flex; flex-direction: column; gap: 20px; }
.kpi { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.kpi-label { font-size: 13px; font-weight: 600; color: var(--muted); }
.kpi-value { font-size: 34px; font-weight: 800; color: var(--ink); }
.kpi-value.bad { color: var(--red); }
.kpi-note { font-size: 13px; }

.row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line-soft); }
.row.top-align { align-items: flex-start; }
.row .grow { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row-title { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.45; }
.row-sub { font-size: 12px; color: var(--muted); }
.row-text { font-size: 13px; line-height: 1.5; color: var(--body); }
.clickable { cursor: pointer; }
.clickable:hover .row-title { color: var(--brand-deep); text-decoration: underline; }
.late { font-size: 12px; font-weight: 700; color: var(--red); white-space: nowrap; }
.soon { font-size: 12px; font-weight: 700; color: var(--amber); white-space: nowrap; }
.plain-date { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; }

.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: #F2F3F5; color: #4B5563; }
.pill.sm { font-size: 11px; padding: 3px 9px; }
.pill.amber { background: var(--amber-tint); color: var(--amber); }
.pill.blue { background: #E3F3FD; color: var(--brand-deep); }
.pill.purple { background: #EEEAFB; color: #4B3B8F; }
.pill.green { background: var(--green-tint); color: var(--green); }
.pill.red { background: var(--red-tint); color: var(--red); }
.prio { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; flex-shrink: 0; }
.prio.p1 { background: #0B3C5D; color: #fff; } .prio.p2 { background: #D6EEFD; color: var(--brand-deep); } .prio.p3 { background: #F1F4F7; color: var(--text); }

.bar-row { display: flex; align-items: center; gap: 14px; padding: 5px 0; }
.bar-name { width: 110px; font-size: 13px; font-weight: 600; color: var(--text); }
.bar { flex-grow: 1; height: 22px; display: flex; gap: 2px; background: #F1F4F7; border-radius: 6px; overflow: hidden; }
.bar span { height: 100%; }
.bar-total { width: 28px; text-align: right; font-size: 14px; font-weight: 700; color: var(--ink); }
.legend { display: flex; gap: 18px; font-size: 12px; padding-top: 6px; }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 40px; padding: 0 16px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid #D5DEE6; background: #fff; color: var(--text); }
.chip.on { border-color: var(--brand-dark); background: var(--brand-dark); color: #fff; }
.table { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.tr { display: grid; grid-template-columns: 2.2fr 1.1fr 1.1fr 2.4fr .8fr .8fr; gap: 16px; padding: 16px 22px; border-bottom: 1px solid var(--line-soft); align-items: start; }
.tr.head { padding: 14px 22px; background: #F8FAFC; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 700; letter-spacing: .4px; color: var(--muted); }
.tr.body { cursor: pointer; }
.tr.body:hover { background: #FAFCFE; }
.cell { font-size: 13px; color: var(--text); line-height: 1.5; }

.note-list { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 170px); overflow: auto; position: sticky; top: 110px; }
.note-item { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 56px; padding: 10px 14px; border: none; border-radius: 10px; text-align: left; background: transparent; }
.note-item:hover { background: #F4F8FB; }
.note-item.on { background: var(--brand-tint); }
.note { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 18px; }
.note-cat { font-size: 12px; font-weight: 700; letter-spacing: .6px; color: var(--brand-dark); text-transform: uppercase; }
.note h2 { margin: 0; font-size: 22px; font-weight: 800; color: var(--ink); }
.note h3 { margin: 8px 0 0; font-size: 15px; font-weight: 700; color: var(--ink); }
.note h3.done { color: var(--green); } .note h3.next { color: var(--brand-deep); }
.done-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; background: #F3FAF6; border-radius: 10px; font-size: 14px; line-height: 1.5; color: var(--ink); }
.next-item { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; line-height: 1.5; color: var(--ink); }
.next-item .grow { flex-grow: 1; }
.md { font-size: 14px; line-height: 1.6; color: var(--body); }
.md h4 { margin: 18px 0 6px; font-size: 15px; color: var(--ink); }
.md table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 13px; }
.md td, .md th { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
.md th { background: #F8FAFC; color: var(--text); font-weight: 700; }
.md hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
.md ul { margin: 4px 0; padding-left: 20px; }

.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; align-items: start; }
.col { background: #EDF2F6; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 4px 6px; font-size: 14px; font-weight: 700; color: var(--ink); }
.col-head .grow { flex-grow: 1; }
.ai-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.ai-card .row-title { cursor: pointer; }
.ai-card .row-title:hover { color: var(--brand-deep); text-decoration: underline; }
.ai-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--text); }
.ai-card select { height: 36px; border: 1px solid #D5DEE6; border-radius: 8px; padding: 0 8px; font-size: 13px; background: #fff; }

.card.dept-head { flex-direction: row; align-items: center;
}
.dept-head { display: flex; align-items: center; gap: 24px; padding: 22px 24px; }
.dept-bar { width: 6px; align-self: stretch; border-radius: 3px; }
.stat { display: flex; flex-direction: column; gap: 2px; padding-left: 24px; border-left: 1px solid var(--line-soft); min-width: 120px; }
.stat b { font-size: 24px; font-weight: 800; color: var(--ink); }
.stat b.bad { color: var(--red); }
.stat span { font-size: 12px; color: var(--muted); }
.last-note { display: flex; flex-direction: column; gap: 8px; padding: 16px; background: #F5FAFE; border-radius: 12px; }
.small-label { font-size: 12px; font-weight: 700; letter-spacing: .4px; padding-top: 4px; }
.warn-box { display: flex; flex-direction: column; gap: 12px; padding: 18px; background: var(--red-tint); border-radius: 12px; }

.overlay { position: fixed; inset: 0; background: rgba(17, 33, 46, .38); display: flex; justify-content: flex-end; z-index: 20; }
.overlay[hidden] { display: none; }
.drawer { width: 520px; max-width: 100%; height: 100%; background: #fff; padding: 32px; display: flex; flex-direction: column; gap: 16px; overflow: auto; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; }
.drawer h2 { margin: 0; font-size: 20px; font-weight: 800; color: var(--ink); }
.icon-btn { width: 44px; height: 44px; border: none; background: #F1F4F7; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text); }
.field input, .field select, .field textarea { min-height: 44px; padding: 10px 12px; border: 1px solid #D5DEE6; border-radius: 10px; font-size: 14px; color: var(--ink); background: #fff; font-weight: 400; }
.field textarea { resize: vertical; line-height: 1.5; }
.field .hint { font-weight: 400; font-size: 12px; color: var(--muted); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks input { min-height: 0; padding: 0; width: 16px; height: 16px; margin: 0; }
.checks label { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border: 1px solid #D5DEE6; border-radius: 999px; font-weight: 500; font-size: 13px; }
.drawer-foot { display: flex; gap: 10px; margin-top: auto; padding-top: 8px; }
.drawer-foot .btn { flex-grow: 1; height: 46px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 30; }
.toast.err { background: var(--red); }

@media (max-width: 1300px) {
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 1100px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3, .board { grid-template-columns: minmax(0, 1fr); }
  .span-2 { grid-column: auto; }
  .tr { grid-template-columns: 2fr 1fr 1.6fr; }
  .tr > :nth-child(4), .tr > :nth-child(5) { display: none; }
  .note-list { position: static; max-height: 320px; }
}
@media (max-width: 760px) {
  .app { flex-direction: column; }
  .side { width: 100%; height: auto; position: static; flex-direction: row; flex-wrap: wrap; gap: 12px; padding: 16px; }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .nav-group { width: 100%; flex-direction: row; flex-wrap: wrap; gap: 4px 14px; }
  .nav-label { width: 100%; }
  .top, .content { padding-left: 16px; padding-right: 16px; }
  .search { width: 100%; }
  .grid-4 { grid-template-columns: minmax(0, 1fr); }
  .dept-head { flex-wrap: wrap; }
}
</style>

</head>

  var $ = function (id) { return document.getElementById(id); };

  function pd(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function today() { return pd(S.data.meta.today) || new Date(); }
  function days(s) { var d = pd(s); return d ? Math.round((d - today()) / 86400000) : null; }
  function fShort(s) { var d = pd(s); return d ? d.getDate() + ' ' + BULAN[d.getMonth()] : '—'; }
  function fLong(s) { var d = pd(s); return d ? d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear() : '—'; }
  function list(s) { return String(s || '').split(/\s*[,;]\s*/).filter(Boolean); }

  // Markdown ringan untuk catatan lama dari Notion
  function md(text) {
    var lines = String(text || '').replace(/\r/g, '').split('\n');
    var out = [], tbl = [], ul = [];
    function inline(s) {
      return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

      if (!tbl.length) return;
      var rows = tbl.map(function (l) { return l.replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); }); });
      var h = '<table><tr>' + rows[0].map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') + '</tr>';
      rows.slice(1).forEach(function (r) { h += '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; });
      out.push(h + '</table>'); tbl = [];
    }
    function flushU() { if (ul.length) { out.push('<ul>' + ul.join('') + '</ul>'); ul = []; } }
    lines.forEach(function (l) {
      var t = l.trim();
      if (/^\|.*\|$/.test(t)) { flushU(); tbl.push(t); return; }
      flushT();
      if (/^[-*•]\s+/.test(t)) { ul.push('<li>' + inline(t.replace(/^[-*•]\s+/, '')) + '</li>'); return; }

      if (/^-{3,}$/.test(t)) out.push('<hr>');

  // Ambil item "Done" & "Next week" dari tabel catatan lama Notion
  function parseLegacy(body) {
    var res = { done: [], next: [] }, sec = null, first = false;
    String(body || '').split('\n').forEach(function (l) {
      var t = l.trim();
      if (/^#{1,6}\s/.test(t)) { sec = /done/i.test(t) ? 'done' : (/next/i.test(t) ? 'next' : null); first = true; return; }
      if (sec && /^\|.*\|$/.test(t)) {
        if (first) { first = false; return; }
        var c = t.replace(/^\||\|$/g, '').split('|').map(function (x) { return x.trim(); });
        if (c[0]) res[sec].push(c[0] + (sec === 'next' && c[1] ? ' | ' + c[1] : ''));
      } else if (sec && /^[-*•]\s+/.test(t)) res[sec].push(t.replace(/^[-*•]\s+/, ''));
    });
    return res;
  }

  function lastNoteSummary(n) {
    var done = list2(n.done), next = list2(n.nextWeek);
    if (!done.length && !next.length) { var lg = parseLegacy(n.body); done = lg.done; next = lg.next; }
    if (!done.length && !next.length) {
      var txt = String(n.body || '').replace(/[#|*]/g, ' ').replace(/\s+/g, ' ').trim();
      return '<span class="row-text">' + esc(txt.slice(0, 220)) + (txt.length > 220 ? '…' : '') + '</span>';

    return (done.length ? '<span class="small-label" style="color:#1E6B45">DONE</span>' + done.slice(0, 4).map(function (x) { return '<span class="row-text">• ' + esc(x) + '</span>'; }).join('') : '') +

  function collect(form) {
    var o = {}, fd = form.elements;
    for (var i = 0; i < fd.length; i++) {

      if (el.type === 'checkbox') { o[el.name] = o[el.name] || []; if (el.checked) o[el.name].push(el.value); }
      else o[el.name] = el.value.trim();

    Object.keys(o).forEach(function (k) { if (Array.isArray(o[k])) o[k] = o[k].join(', '); });
    return o;

    else if (a === 'dept') { S.view = 'dept'; S.dept = el.getAttribute('data-d'); window.scrollTo(0, 0); render(); }
    else if (a === 'filter') { S.filterDept = el.getAttribute('data-f'); render(); }
    else if (a === 'toTracker') { S.view = 'outstanding'; S.filterDept = S.dept; render(); }
    else if (a === 'openNote') { S.view = 'notes'; S.noteId = id; S.q = ''; $('search').value = ''; render(); }

  });
  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.getAttribute && el.getAttribute('data-act') === 'aiStatus') {
      var id = el.getAttribute('data-id'), v = el.value;
      var rec = S.data.actions.filter(function (x) { return x.id === id; })[0];
      if (!S.filler) { el.value = rec.status; save('actions', {}); return; }
      rec.status = v; render();
      save('actions', { id: id, status: v });
    }
  });
  $('overlay').addEventListener('click', function (ev) { if (ev.target === $('overlay')) closeDrawer(); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !$('overlay').hidden) closeDrawer(); });
  $('drawer').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var o = collect(ev.target), key = o._key; delete o._key;
    if (key === 'notes' && !o.name) o.name = o.date + ' | ' + o.category + ' Weekly';
    var b = $('saveBtn'); b.disabled = true; b.textContent = 'Saving…';
    save(key, o, function (newId) { closeDrawer(); if (key === 'notes') { S.view = 'notes'; S.noteId = newId; } });
  });
  $('addBtn').addEventListener('click', function () {
    if (S.view === 'notes') formNote(); else if (S.view === 'actions') formAI(); else formOT();
  });
  $('search').addEventListener('input', function (ev) {
    S.q = ev.target.value.trim();
    if (S.q && (S.view === 'overview' || S.view === 'dept')) { S.view = 'outstanding'; S.filterDept = 'All'; }
    render();
  });
  $('filler').addEventListener('change', function (ev) { S.filler = ev.target.value; lsSet('okFiller', S.filler); ev.target.classList.remove('need'); });

  /* ---------------- Load ---------------- */
  function load() {
    google.script.run
      .withSuccessHandler(function (d) {
        S.data = d;
        if (!S.filler) { S.filler = lsGet('okFiller') || d.meta.viewer || ''; $('filler').value = S.filler; }
        render();
      })
      .withFailureHandler(function (e) { $('content').innerHTML = '<div class="empty">Failed to load data: ' + esc(e && e.message ? e.message : e) + '</div>'; })
      .getData();
  }
  load();
})();
</script>

</body>
</html>
